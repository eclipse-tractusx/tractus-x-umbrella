<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b33"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#ffa600" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffa600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f0ea"/>
      <stop offset="1" stop-color="#9f9a91"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a38"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4048"/>
      <stop offset="1" stop-color="#22262c"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3424"/>
      <stop offset="1" stop-color="#24180f"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <symbol id="txlogo" viewBox="-100 -100 200 200">
      <rect x="-88" y="-27" width="176" height="54" rx="27" fill="none" stroke="#b3cb2d" stroke-width="18" transform="rotate(45)"/>
      <rect x="-88" y="-27" width="176" height="54" rx="27" fill="none" stroke="#ffa600" stroke-width="18" transform="rotate(-45)"/>
    </symbol>
    <symbol id="umbrella" viewBox="-50 -50 100 100">
      <path d="M-42 0 A42 42 0 0 1 42 0 Q31.5 -9 21 0 Q10.5 -9 0 0 Q-10.5 -9 -21 0 Q-31.5 -9 -42 0 Z" fill="#ffa600"/>
      <path d="M0 -42 L0 -48" stroke="#ffa600" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 0 L0 34 Q0 44 -9 44 Q-17 44 -17 36" fill="none" stroke="#b3cb2d" stroke-width="6" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- workshop background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g fill="#ffffff" opacity="0.05">
    <rect x="860" y="120" width="140" height="18"/>
    <rect x="880" y="60" width="40" height="60"/>
    <rect x="930" y="80" width="50" height="40"/>
    <rect x="860" y="300" width="140" height="18"/>
    <rect x="870" y="240" width="60" height="60"/>
    <rect x="20" y="520" width="160" height="16"/>
    <rect x="40" y="470" width="50" height="50"/>
  </g>

  <!-- title -->
  <use href="#txlogo" x="70" y="50" width="230" height="230"/>
  <g font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" fill="#f2efe9">
    <text x="72" y="345" font-size="66">ECLIPSE</text>
    <text x="72" y="415" font-size="66">TRACTUS-X</text>
  </g>
  <text x="74" y="465" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="27" letter-spacing="5" fill="#cfd4da">UMBRELLA GUARDIAN</text>

  <!-- left arm (mostly behind the laptop) -->
  <path d="M520 630 L515 820 L590 905" fill="none" stroke="#bdb8af" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- torso -->
  <path d="M520 610 Q540 525 625 508 L775 508 Q860 525 880 610 L915 1024 L485 1024 Z" fill="url(#armor)"/>
  <path d="M610 560 L790 560 L770 760 Q700 790 630 760 Z" fill="#2b2f36"/>
  <circle cx="700" cy="655" r="56" fill="#15181d" stroke="#ffa600" stroke-width="5"/>
  <use href="#umbrella" x="652" y="607" width="96" height="96"/>
  <path d="M560 600 L600 600 L590 640 L548 640 Z" fill="#ffa600"/>
  <path d="M840 600 L800 600 L810 640 L852 640 Z" fill="#ffa600"/>
  <path d="M640 790 L760 790" stroke="#ffa600" stroke-width="10" stroke-linecap="round"/>
  <circle cx="625" cy="585" r="5" fill="#1c1f24"/>
  <circle cx="775" cy="585" r="5" fill="#1c1f24"/>

  <!-- shoulder pads -->
  <rect x="440" y="545" width="150" height="110" rx="45" fill="url(#armor)" transform="rotate(-18 515 600)"/>
  <rect x="810" y="545" width="150" height="110" rx="45" fill="url(#armor)" transform="rotate(18 885 600)"/>
  <rect x="470" y="580" width="70" height="14" rx="7" fill="#ffa600" transform="rotate(-18 515 600)"/>
  <rect x="860" y="580" width="70" height="14" rx="7" fill="#ffa600" transform="rotate(18 885 600)"/>

  <!-- neck -->
  <rect x="655" y="440" width="90" height="80" rx="14" fill="#2b2f36"/>
  <path d="M665 462 H735 M665 482 H735 M665 502 H735" stroke="#454b55" stroke-width="6"/>

  <!-- head -->
  <rect x="580" y="205" width="240" height="245" rx="100" fill="url(#armor)"/>
  <rect x="687" y="200" width="26" height="95" rx="12" fill="#ffa600"/>
  <path d="M598 292 Q700 262 802 292 L792 370 Q700 392 608 370 Z" fill="url(#visor)" stroke="#2b2f36" stroke-width="6"/>
  <path d="M615 295 Q690 276 760 285" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>
  <g>
    <rect x="636" y="322" width="44" height="14" rx="7" fill="#33e1ff" filter="url(#blur)"/>
    <rect x="720" y="322" width="44" height="14" rx="7" fill="#33e1ff" filter="url(#blur)"/>
    <rect x="640" y="324" width="36" height="10" rx="5" fill="#bff6ff"/>
    <rect x="724" y="324" width="36" height="10" rx="5" fill="#bff6ff"/>
  </g>
  <path d="M665 410 H735 M670 424 H730" stroke="#6d6a64" stroke-width="5" stroke-linecap="round"/>

  <!-- headphones -->
  <path d="M572 345 C560 140 840 140 828 345" fill="none" stroke="#2b2f36" stroke-width="30" stroke-linecap="round"/>
  <path d="M572 345 C560 140 840 140 828 345" fill="none" stroke="#ffa600" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 0"/>
  <rect x="528" y="270" width="78" height="130" rx="34" fill="#2b2f36" filter="url(#shadow)"/>
  <rect x="794" y="270" width="78" height="130" rx="34" fill="#2b2f36" filter="url(#shadow)"/>
  <rect x="538" y="282" width="58" height="106" rx="28" fill="none" stroke="#b3cb2d" stroke-width="6"/>
  <rect x="804" y="282" width="58" height="106" rx="28" fill="none" stroke="#b3cb2d" stroke-width="6"/>
  <use href="#txlogo" x="812" y="313" width="42" height="42"/>
  <circle cx="567" cy="300" r="5" fill="#33e1ff"/>
  <path d="M552 388 Q575 450 645 430" fill="none" stroke="#2b2f36" stroke-width="9" stroke-linecap="round"/>
  <circle cx="648" cy="429" r="11" fill="#ffa600"/>

  <!-- desk -->
  <rect x="0" y="935" width="1024" height="89" fill="url(#desk)"/>
  <rect x="0" y="935" width="1024" height="5" fill="#6b4c33"/>

  <!-- coffee mug -->
  <path d="M925 875 Q920 850 930 830 M950 870 Q945 845 955 825" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  <rect x="905" y="885" width="80" height="90" rx="10" fill="#e9e6df"/>
  <path d="M985 905 Q1015 905 1015 930 Q1015 955 985 955" fill="none" stroke="#e9e6df" stroke-width="12"/>
  <use href="#txlogo" x="923" y="905" width="44" height="44"/>

  <!-- laptop base -->
  <polygon points="30,955 660,935 700,985 10,1005" fill="#1b1e23"/>

  <!-- right arm and hand on the keyboard -->
  <path d="M890 630 L875 815 L735 890" fill="none" stroke="#c9c4bb" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="875" cy="815" r="30" fill="#2b2f36"/>
  <circle cx="875" cy="815" r="12" fill="#ffa600"/>
  <rect x="790" y="840" width="40" height="18" rx="6" fill="#ffa600" transform="rotate(-28 810 849)"/>
  <g transform="translate(0 -38) rotate(-8 700 935)">
    <rect x="655" y="905" width="95" height="55" rx="16" fill="#d9d4cb"/>
    <rect x="640" y="945" width="18" height="38" rx="8" fill="#9f9a91"/>
    <rect x="662" y="952" width="18" height="40" rx="8" fill="#9f9a91"/>
    <rect x="684" y="954" width="18" height="40" rx="8" fill="#9f9a91"/>
    <rect x="706" y="952" width="18" height="38" rx="8" fill="#9f9a91"/>
    <rect x="728" y="946" width="16" height="32" rx="8" fill="#9f9a91"/>
  </g>

  <!-- laptop lid full of stickers -->
  <g transform="rotate(-2 340 785)">
    <rect x="55" y="615" width="570" height="335" rx="20" fill="url(#lid)" stroke="#4b515a" stroke-width="4" filter="url(#shadow)"/>

    <!-- Tractus-X logo sticker -->
    <g filter="url(#shadow)">
      <rect x="80" y="640" width="270" height="110" rx="16" fill="#1a1d22" stroke="#4b515a" stroke-width="2"/>
      <use href="#txlogo" x="88" y="648" width="94" height="94"/>
      <text x="190" y="690" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="30" fill="#f2efe9">ECLIPSE</text>
      <text x="190" y="725" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#f2efe9">TRACTUS-X</text>
    </g>

    <!-- I <3 UMBRELLA -->
    <g transform="rotate(-7 480 690)" filter="url(#shadow)">
      <rect x="370" y="650" width="236" height="76" rx="14" fill="#fbfaf7"/>
      <text x="386" y="702" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#15181d">I</text>
      <path d="M410 680 C410 668 426 664 432 676 C438 664 454 668 454 680 C454 694 432 706 432 708 C432 706 410 694 410 680 Z" fill="#e5383b"/>
      <text x="462" y="700" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="21" fill="#15181d">UMBRELLA</text>
    </g>

    <!-- helm install terminal sticker -->
    <g transform="rotate(3 245 805)" filter="url(#shadow)">
      <rect x="80" y="772" width="330" height="66" rx="12" fill="#0b0d10" stroke="#b3cb2d" stroke-width="3"/>
      <circle cx="98" cy="788" r="5" fill="#e5383b"/>
      <circle cx="114" cy="788" r="5" fill="#ffa600"/>
      <circle cx="130" cy="788" r="5" fill="#b3cb2d"/>
      <text x="96" y="823" font-family="Menlo, Consolas, 'Courier New', monospace" font-weight="700" font-size="22" fill="#b3cb2d">$ helm install umbrella</text>
    </g>

    <!-- Community Days veteran badge -->
    <g filter="url(#shadow)">
      <circle cx="510" cy="815" r="62" fill="#ffa600" stroke="#fbfaf7" stroke-width="5"/>
      <text x="510" y="800" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="17" fill="#15181d">COMMUNITY</text>
      <text x="510" y="828" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="26" fill="#15181d">DAYS</text>
      <text x="510" y="852" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#15181d">VETERAN</text>
    </g>

    <!-- MVD -> UMBRELLA -->
    <g transform="rotate(-4 200 895)" filter="url(#shadow)">
      <rect x="78" y="866" width="252" height="58" rx="10" fill="#b3cb2d"/>
      <text x="204" y="904" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" fill="#15181d">MVD → UMBRELLA</text>
    </g>

    <!-- *.tx.test hex -->
    <g filter="url(#shadow)">
      <polygon points="385,852 422,873 422,915 385,936 348,915 348,873" fill="#33a9d6" stroke="#fbfaf7" stroke-width="3"/>
      <text x="385" y="898" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-weight="700" font-size="11" fill="#0b0d10">*.tx.test</text>
    </g>

    <!-- Developer -->
    <g transform="rotate(5 520 905)" filter="url(#shadow)">
      <rect x="440" y="884" width="160" height="44" rx="8" fill="#2ea043" stroke="#fbfaf7" stroke-width="3"/>
      <text x="520" y="914" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" fill="#fbfaf7">Developer</text>
    </g>

    <!-- small umbrella sticker -->
    <g filter="url(#shadow)">
      <circle cx="360" cy="752" r="26" fill="#fbfaf7"/>
      <use href="#umbrella" x="338" y="730" width="44" height="44"/>
    </g>
  </g>
</svg>
