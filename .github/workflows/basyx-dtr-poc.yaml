name: BaSyx DTR tenant acceptance
on:
  push:
    branches:
      - 'feat/basyx-*'
    paths:
      - 'charts/digital-twin-basyx-bundle/**'
      - 'charts/digital-twin-bundle/**'
      - 'charts/decentralized-identity-connector/Chart.yaml'
      - 'charts/tx-data-provider/**'
      - 'charts/umbrella/Chart.yaml'
      - 'hack/dtr-poc/**'
      - 'hack/helm-dependencies.bash'
      - '.github/workflows/basyx-dtr-poc.yaml'
  pull_request:
    paths:
      - 'charts/digital-twin-basyx-bundle/**'
      - 'charts/digital-twin-bundle/**'
      - 'charts/decentralized-identity-connector/Chart.yaml'
      - 'charts/tx-data-provider/**'
      - 'charts/umbrella/Chart.yaml'
      - 'hack/dtr-poc/**'
      - 'hack/helm-dependencies.bash'
      - '.github/workflows/basyx-dtr-poc.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basyx-dtr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tenant-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install checksum verified test tools
        shell: bash
        run: |
          set -euo pipefail
          download() {
            curl --fail --location --retry 3 "$1" -o "$3"
            checksum=$(curl --fail --location --retry 3 "$2" | awk '{print $1}')
            [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]]
            printf '%s  %s\n' "$checksum" "$3" | sha256sum --check -
          }
          download https://github.com/kubernetes-sigs/kind/releases/download/v0.23.0/kind-linux-amd64 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.23.0/kind-linux-amd64.sha256sum "$RUNNER_TEMP/kind"
          download https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl \
            https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl.sha256 "$RUNNER_TEMP/kubectl"
          download https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz \
            https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz.sha256sum "$RUNNER_TEMP/helm.tgz"
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          cp "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/helm"
          chmod +x "$RUNNER_TEMP/kind" "$RUNNER_TEMP/kubectl" "$RUNNER_TEMP/helm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install acceptance dependencies
        run: python -m pip install -r hack/dtr-poc/requirements.txt
      - name: Resolve Helm dependencies
        run: python hack/dtr-poc/dependencies.py
      - name: Compile acceptance scripts
        run: python -W error -m compileall -q hack/dtr-poc
      - name: Validate hook overrides and cleanup failure diagnostics
        run: python -m unittest discover -s hack/dtr-poc -p 'test_*.py' -v
      - name: Install and validate independent tenants
        run: python hack/dtr-poc/acceptance.py --artifacts "$RUNNER_TEMP/dtr-results"
      - name: Upload sanitized results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: basyx-dtr-results
          path: ${{ runner.temp }}/dtr-results/
          if-no-files-found: ignore
          retention-days: 7
