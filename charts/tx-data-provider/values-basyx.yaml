# Explicit PoC profile. The legacy DTR remains the chart's default.
seedTestdata: false
registryUrl: "http://basyx-dtr-poc-digital-twin-registry:8080/digital-twin-registry"

digital-twin-bundle:
  enabled: false
  digital-twin-registry:
    enabled: false
  postgresql:
    enabled: false

digital-twin-basyx-bundle:
  enabled: true

# Deploy the DTR only. Simple Submodel Server code/configuration is unchanged.
data-persistence-layer-bundle:
  enabled: false
  simple-data-backend:
    enabled: false

dataspace-connector-bundle:
  enabled: false
  tractusx-connector:
    enabled: false
  postgresql:
    enabled: false
  vault:
    enabled: false
