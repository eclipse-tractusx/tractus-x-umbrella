# Sandbox overlay: bundled PostgreSQL instead of an externally provisioned one.
# Usage: helm install <release> charts/digital-twin-basyx-bundle \
#          -f charts/digital-twin-basyx-bundle/values-bundled-postgresql.yaml \
#          --post-renderer python --post-renderer-args hack/dtr-poc/post-render.py
postgresql:
  enabled: true

basyx:
  database:
    type: external
    existingSecret: basyx-database
  configurationService:
    # Run schema initialization as a regular Job (not a Helm hook): the bundled
    # PostgreSQL is a regular release resource and does not exist during
    # pre-install hooks. A post-install hook would deadlock with `helm --wait`
    # because the DTR stays unready until the schema exists.
    hook:
      enabled: false
    waitForDatabase:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
