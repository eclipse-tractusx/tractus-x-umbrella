{{/*
External mode (default): an already provisioned database is initialized by
pre-install/pre-upgrade hooks before the DTR starts.
Bundled mode (postgresql.enabled): the bundled PostgreSQL is a regular release
resource, so initialization runs as a regular Job that waits for the database.
*/}}
{{- if .Values.basyx.enabled -}}
{{- if or (ne .Values.basyx.database.type "external") (empty .Values.basyx.database.existingSecret) -}}
{{- fail "BaSyx DTR bundle requires database.type=external and database.existingSecret (externally provisioned, or rendered by this bundle when postgresql.enabled=true)" -}}
{{- end -}}
{{- if not .Values.basyx.configurationService.enabled -}}
{{- fail "BaSyx DTR bundle requires the Configuration Service to initialize the database schema" -}}
{{- end -}}
{{- $jobAnnotations := .Values.basyx.configurationService.hook.annotations | default dict -}}
{{- if or (hasKey $jobAnnotations "helm.sh/hook") (hasKey $jobAnnotations "helm.sh/hook-weight") (hasKey $jobAnnotations "helm.sh/hook-delete-policy") -}}
{{- fail "BaSyx DTR bundle Configuration Service annotations must not override Helm hook annotations" -}}
{{- end -}}
{{- if .Values.postgresql.enabled -}}
{{- if .Values.basyx.configurationService.hook.enabled -}}
{{- fail "BaSyx DTR bundle with bundled PostgreSQL requires basyx.configurationService.hook.enabled=false (see values-bundled-postgresql.yaml)" -}}
{{- end -}}
{{- if not .Values.basyx.configurationService.waitForDatabase.enabled -}}
{{- fail "BaSyx DTR bundle with bundled PostgreSQL requires basyx.configurationService.waitForDatabase.enabled=true (see values-bundled-postgresql.yaml)" -}}
{{- end -}}
{{- else -}}
{{- if or (not .Values.basyx.configurationService.hook.enabled) (not (has "pre-install" .Values.basyx.configurationService.hook.events)) (not (has "pre-upgrade" .Values.basyx.configurationService.hook.events)) -}}
{{- fail "BaSyx DTR bundle requires Configuration Service pre-install and pre-upgrade hooks" -}}
{{- end -}}
{{- if ne .Values.basyx.configurationService.hook.weight "-10" -}}
{{- fail "BaSyx DTR bundle requires its Configuration Service job hook at weight -10" -}}
{{- end -}}
{{- if or (not .Values.basyx.serviceAccount.create) (ne (get .Values.basyx.serviceAccount.annotations "helm.sh/hook") "pre-install,pre-upgrade") (ne (get .Values.basyx.serviceAccount.annotations "helm.sh/hook-weight") "-20") -}}
{{- fail "BaSyx DTR bundle requires its Configuration Service account hook at weight -20" -}}
{{- end -}}
{{- if ne (get .Values.basyx.serviceAccount.annotations "helm.sh/hook-delete-policy") "before-hook-creation" -}}
{{- fail "BaSyx DTR bundle requires its Configuration Service account hook delete policy before-hook-creation" -}}
{{- end -}}
{{- end -}}
{{- end -}}
