{{/* Database Secret consumed by the BaSyx chart when the bundled PostgreSQL is used. */}}
{{- if and .Values.basyx.enabled .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.basyx.database.existingSecret }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  host: {{ include "digital-twin-basyx-bundle.postgresql.host" . | quote }}
  port: "5432"
  dbname: {{ .Values.postgresql.auth.database | quote }}
  user: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
  sslmode: "disable"
  jdbc-uri: {{ printf "jdbc:postgresql://%s:5432/%s?sslmode=disable" (include "digital-twin-basyx-bundle.postgresql.host" .) .Values.postgresql.auth.database | quote }}
{{- end }}
