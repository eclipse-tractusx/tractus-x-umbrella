# Provision basyx-poc-database out of band in the release namespace.
basyx:
  enabled: true
  # BaSyx chart 3.15.0 / appVersion 1.1.0.
  # Provision credentials in the referenced Secret before installation.
  # Only the disposable acceptance harness creates test database resources.
  instanceName: basyx-poc
  fullnameOverride: basyx-dtr-poc
  host: basyx-poc.invalid

  # The external PostgreSQL and its Secret must exist before Helm installation.
  # Create the Configuration Service account before the initialization Job.
  # Source: https://helm.sh/docs/v3/topics/charts_hooks/
  serviceAccount:
    create: true
    automount: false
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: "-20"
      helm.sh/hook-delete-policy: before-hook-creation

  tls:
    enabled: false
    hosts: []

  ingress:
    className: ""
    annotations: {}
    issuer: ""
    clusterIssuer: ""
    certificateIssuer:
      enabled: false

  gatewayApi:
    parentRefs: []
    gateway:
      enabled: false

  keycloak:
    enabled: false

  abac:
    enabled: false

  configurationService:
    enabled: true
    waitForDatabase:
      enabled: false
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
    image:
      repository: eclipsebasyx/basyxconfigurationservice-go
      pullPolicy: IfNotPresent
      tag: ""
      digest: sha256:b8f863fb44dd422cae83d7e27a1f049800106db2030332a0f33d4e45ec125219
    hook:
      enabled: true
      weight: "-10"
      events:
        - pre-install
        - pre-upgrade

  database:
    type: external
    existingSecret: basyx-poc-database

  environment:
    common:
      ABAC_ENABLED: false
      OIDC_ISSUER: ""
      OIDC_AUDIENCE: ""
      SERVER_STRICTVERIFICATION: permissive
      POSTGRES_MAXOPENCONNECTIONS: 10
      POSTGRES_MAXIDLECONNECTIONS: 5

  aasDiscovery:
    enabled: false
  aasRegistry:
    enabled: false
  aasRepository:
    enabled: false
  aasEnvironment:
    enabled: false
  dppApi:
    enabled: false
  submodelRegistry:
    enabled: false
  submodelRepository:
    enabled: false
  cdRepository:
    enabled: false
  companyLookup:
    enabled: false
  aasWebGui:
    enabled: false

  digitalTwinRegistry:
    enabled: true
    replicaCount: 1
    image:
      repository: eclipsebasyx/digitaltwinregistry-go
      pullPolicy: IfNotPresent
      tag: ""
      digest: sha256:cc935fb6b320065e1f2a44c2c912c1261b97d848e8510f300708fe4ecd21bbc4
    ingress:
      enabled: false
    httpRoute:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 512Mi
