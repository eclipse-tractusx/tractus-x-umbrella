# Overlay for values-adopter-data-exchange.yaml: replaces the Tractus-X Digital
# Twin Registry of the data provider with the Eclipse BaSyx Digital Twin Registry.
# EDC data exchange, submodel server, wallet stub and test data stay the same.
#
#   helm install umbrella charts/umbrella --namespace umbrella --create-namespace \
#     -f charts/umbrella/values-adopter-data-exchange.yaml \
#     -f charts/umbrella/values-adopter-data-exchange-basyx.yaml \
#     --post-renderer python3 --post-renderer-args hack/dtr-poc/post-render.py
#
# The post-renderer removes the unused cert-manager Issuer that BaSyx chart 3.15.0
# always renders; it is not needed when cert-manager CRDs are installed.
# Guide: docs/user/common/guides/basyx-dtr-poc.md

tx-data-provider:
  # -- Seed test data on install (enable/disable switch): shell descriptors in the
  # BaSyx DTR, submodels in the submodel server, and EDC assets, policies and
  # contract definitions for both (including the DTR asset).
  seedTestdata: true
  # -- Empty: derive the in-cluster BaSyx DTR URL (http://<basyx fullname>-digital-twin-registry:8080/digital-twin-registry).
  # BaSyx serves the registry API under /digital-twin-registry, without /api/v3.
  registryUrl: ""

  digital-twin-bundle:
    enabled: false

  digital-twin-basyx-bundle:
    enabled: true
    # -- Bundled PostgreSQL (BaSyx needs PostgreSQL 16+); fake sandbox credentials
    postgresql:
      enabled: true
      fullnameOverride: dataprovider-basyx-db
      # -- uncomment the following to disable persistence
      # primary:
      #   persistence:
      #     enabled: false
    basyx:
      instanceName: dataprovider
      fullnameOverride: dataprovider-basyx
      # -- Ingress host of the BaSyx DTR (API under /digital-twin-registry)
      host: dataprovider-basyx-dtr.tx.test
      database:
        type: external
        # -- Rendered by digital-twin-basyx-bundle from the bundled PostgreSQL values
        existingSecret: dataprovider-basyx-database
      configurationService:
        # -- Regular Job instead of a pre-install hook, so it can wait for the bundled PostgreSQL
        hook:
          enabled: false
        waitForDatabase:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      ingress:
        className: nginx
      digitalTwinRegistry:
        ingress:
          enabled: true
          className: nginx
